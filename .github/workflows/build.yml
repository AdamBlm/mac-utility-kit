name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macOS:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install media engines for integration tests
        shell: bash
        run: |
          brew install ffmpeg-full imagemagick exiftool
          ffmpeg_directory="$(brew --prefix ffmpeg-full)/bin"
          magick="$(brew --prefix imagemagick)/bin/magick"
          "$ffmpeg_directory/ffmpeg" -version
          "$ffmpeg_directory/ffprobe" -version
          exiftool="$(brew --prefix exiftool)/bin/exiftool"
          "$magick" -version
          "$exiftool" -ver
          {
            printf 'MAC_UTILITY_FFMPEG_TEST=%s\n' "$ffmpeg_directory/ffmpeg"
            printf 'MAC_UTILITY_FFPROBE_TEST=%s\n' "$ffmpeg_directory/ffprobe"
            printf 'MAC_UTILITY_MAGICK_TEST=%s\n' "$magick"
            printf 'MAC_UTILITY_EXIFTOOL_TEST=%s\n' "$exiftool"
          } >> "$GITHUB_ENV"
      - name: Install document engines for integration tests
        shell: bash
        run: |
          brew install qpdf pandoc ghostscript
          qpdf="$(brew --prefix qpdf)/bin/qpdf"
          pandoc="$(brew --prefix pandoc)/bin/pandoc"
          ghostscript="$(brew --prefix ghostscript)/bin/gs"
          "$qpdf" --version
          "$pandoc" --version
          "$ghostscript" --version
          {
            printf 'MAC_UTILITY_QPDF_TEST=%s\n' "$qpdf"
            printf 'MAC_UTILITY_PANDOC_TEST=%s\n' "$pandoc"
            printf 'MAC_UTILITY_GHOSTSCRIPT_TEST=%s\n' "$ghostscript"
          } >> "$GITHUB_ENV"
      - name: Set up the PDF forms integration test
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/muk-pdf-forms"
          forms_python="$RUNNER_TEMP/muk-pdf-forms/bin/python3"
          "$forms_python" -m pip install --disable-pip-version-check "pypdf==6.21.4"
          printf 'MAC_UTILITY_FORMS_PYTHON=%s\n' "$forms_python" >> "$GITHUB_ENV"
      - name: Build test targets
        run: swift build --build-tests
      - name: Run tests
        id: tests
        timeout-minutes: 6
        shell: bash
        run: |
          swift test --skip-build --no-parallel > >(tee "$RUNNER_TEMP/muk-test-run.log") 2>&1 &
          test_pid=$!
          (
            for ((elapsed = 0; elapsed < 150; elapsed++)); do
              kill -0 "$test_pid" 2>/dev/null || exit 0
              sleep 1
            done
            echo "The test process is still running. Capturing its stacks."
            for pid in "$test_pid" $(pgrep -P "$test_pid" || true); do
              report="$RUNNER_TEMP/muk-test-stack-$pid.txt"
              if sample "$pid" 2 1 -file "$report"; then
                head -n 180 "$report"
              fi
            done
          ) &
          watchdog_pid=$!
          trap 'kill "$watchdog_pid" 2>/dev/null || true' EXIT
          wait "$test_pid"
      - name: Print Swift test crash reports
        if: failure() && steps.tests.conclusion == 'failure'
        run: |
          python3 - <<'PYTHON'
          import json
          import time
          from pathlib import Path

          roots = [Path.home() / "Library/Logs/DiagnosticReports", Path("/Library/Logs/DiagnosticReports")]
          for attempt in range(6):
              reports = [p for root in roots for p in root.glob("swiftpm-testing-helper*.ips")
                         if time.time() - p.stat().st_mtime < 600]
              if reports:
                  break
              time.sleep(2)
          for report in sorted(reports):
              heading, body = report.read_text().split("\n", 1)
              crash = json.loads(body)
              print(report.name, crash.get("exception"), crash.get("termination"))
              threads = crash.get("threads", [])
              images = crash.get("usedImages", [])
              for thread in threads:
                  if not thread.get("triggered"):
                      continue
                  for frame in thread.get("frames", []):
                      index = frame.get("imageIndex", -1)
                      image = images[index].get("name") if 0 <= index < len(images) else "Unknown"
                      print(image, frame.get("symbol", ""), frame.get("imageOffset"))
          if not reports:
              print("No Swift test crash reports were collected.")
          PYTHON
      - name: Reproduce a test crash under LLDB
        if: failure() && steps.tests.conclusion == 'failure'
        timeout-minutes: 2
        shell: bash
        run: |
          grep -q 'unexpected signal code' "$RUNNER_TEMP/muk-test-run.log" || exit 0
          swift_bin="$(xcrun --find swift)"
          helper="${swift_bin%/*}/../libexec/swift/pm/swiftpm-testing-helper"
          bundle="$(find .build -type f -path '*/MacUtilityKitPackageTests.xctest/Contents/MacOS/MacUtilityKitPackageTests' -print -quit)"
          test -x "$helper" && test -f "$bundle"
          frameworks="$(xcrun --sdk macosx --show-sdk-platform-path)/Developer/Library/Frameworks"
          xcrun lldb --batch -o 'settings set target.disable-aslr false' \
            -o "settings set target.env-vars DYLD_FRAMEWORK_PATH=$frameworks" \
            -o run -k 'thread backtrace all' -- \
            "$helper" --test-bundle-path "$bundle" --no-parallel "$bundle" --testing-library swift-testing
      - run: ./scripts/build-app.sh
      - run: codesign --verify --deep --strict 'build/Mac Utility Kit.app'
      - run: python3 scripts/check-bundled-licenses.py 'build/Mac Utility Kit.app'
      - name: Verify the packaged tool catalog
        run: python3 scripts/check-tool-catalog.py 'build/Mac Utility Kit.app/Contents/MacOS/muk'
      - run: python3 scripts/check-mcp.py 'build/Mac Utility Kit.app/Contents/MacOS/muk'
      - run: ./scripts/build-dmg.sh
      - name: Launch the workspace from the disk image and an installed copy
        timeout-minutes: 2
        shell: bash
        run: bash scripts/check-dmg-launch.sh "build/Mac Utility Kit Preview.dmg"
