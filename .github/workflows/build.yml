name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macOS:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build test targets
        run: swift build --build-tests
      - name: Run tests
        id: tests
        timeout-minutes: 4
        shell: bash
        run: |
          swift test --skip-build --no-parallel &
          test_pid=$!
          (
            for ((elapsed = 0; elapsed < 90; elapsed++)); do
              kill -0 "$test_pid" 2>/dev/null || exit 0
              sleep 1
            done
            echo "The test process is still running. Capturing its stacks."
            for pid in "$test_pid" $(pgrep -P "$test_pid" || true); do
              report="$RUNNER_TEMP/muk-test-stack-$pid.txt"
              if sample "$pid" 2 1 -file "$report"; then
                head -n 180 "$report"
              fi
            done
          ) &
          watchdog_pid=$!
          trap 'kill "$watchdog_pid" 2>/dev/null || true' EXIT
          wait "$test_pid"
      - name: Print Swift test crash reports
        if: failure() && steps.tests.conclusion == 'failure'
        run: |
          python3 - <<'PYTHON'
          import json
          import time
          from pathlib import Path

          roots = [Path.home() / "Library/Logs/DiagnosticReports", Path("/Library/Logs/DiagnosticReports")]
          for attempt in range(6):
              reports = [p for root in roots for p in root.glob("swiftpm-testing-helper*.ips")
                         if time.time() - p.stat().st_mtime < 600]
              if reports:
                  break
              time.sleep(2)
          for report in sorted(reports):
              heading, body = report.read_text().split("\n", 1)
              crash = json.loads(body)
              print(report.name, crash.get("exception"), crash.get("termination"))
              threads = crash.get("threads", [])
              images = crash.get("usedImages", [])
              for thread in threads:
                  if not thread.get("triggered"):
                      continue
                  for frame in thread.get("frames", []):
                      index = frame.get("imageIndex", -1)
                      image = images[index].get("name") if 0 <= index < len(images) else "Unknown"
                      print(image, frame.get("symbol", ""), frame.get("imageOffset"))
          if not reports:
              print("No Swift test crash reports were collected.")
          PYTHON
      - run: ./scripts/build-app.sh
      - run: codesign --verify --deep --strict 'build/Mac Utility Kit.app'
      - name: Verify the packaged tool catalog
        run: |
          python3 - <<'PYTHON'
          import json
          import re
          import subprocess
          from pathlib import Path

          catalog = json.loads(subprocess.check_output(["build/Mac Utility Kit.app/Contents/MacOS/muk", "catalog"]))
          inventory = re.findall(r"^- \*\*(.+?)\*\*", Path("docs/feature-inventory.md").read_text(), re.MULTILINE)
          titles = [entry["title"] for entry in catalog]
          assert len(titles) == len(inventory) == 102
          assert len({entry["id"] for entry in catalog}) == len(catalog), "Duplicate tool IDs"
          assert sorted(titles) == sorted(inventory), "The app catalog and roadmap inventory differ"
          assert all(isinstance(entry["inputTypes"], list) and all(
              isinstance(kind, str) and kind for kind in entry["inputTypes"]
          ) for entry in catalog), "The catalog is missing accepted input type identifiers"
          PYTHON
      - run: python3 scripts/check-mcp.py 'build/Mac Utility Kit.app/Contents/MacOS/muk'
      - run: ./scripts/build-dmg.sh
